name: Verify static demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the reviewed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20.19.5'
          package-manager-cache: false
      - name: Install locked dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the Chromium test runtime
        run: npx playwright install --with-deps chromium
      - name: Run the complete local quality gate
        run: npm run verify
